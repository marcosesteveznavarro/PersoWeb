<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonito Cadáver — Tattoo studio en Vigo</title>
<meta name="theme-color" content="#E9EFFA">
<meta name="robots" content="noindex, nofollow, noarchive">
<style>
@font-face{font-family:"Archivo";src:url(bonito-cadaver-v9ee9e8t/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"Bodoni Moda";src:url(bonito-cadaver-v9ee9e8t/bodoni.woff2) format("woff2");font-weight:400 900;font-display:swap}

:root{
  --hielo:#E9EFFA;   /* blanco helado del fondo */
  --bruma:#C6D3EC;   /* azul niebla */
  --cobalto:#2B3FA6; /* reflejo de la corona */
  --tinta:#141A3A;   /* azul noche para texto */
  --blanco:#FFFFFF;
  --pad:clamp(18px,3.2vw,44px);
  --mx:0; --my:0;    /* deriva del puntero, la escribe el script */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--hielo)}
body{font-family:"Archivo",system-ui,sans-serif;color:var(--tinta);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--cobalto);outline-offset:4px;border-radius:4px}

/* ---------- Hero ---------- */
.hero{position:relative;height:100vh;height:100svh;min-height:480px;overflow:hidden;isolation:isolate;background:var(--hielo)}
.hero__still,.hero__gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero__still{object-fit:cover;object-position:52% 50%;animation:respira 26s ease-in-out infinite alternate}
.hero__gl{opacity:0;transition:opacity .6s ease}
.hero.is-live .hero__gl{opacity:1}
.hero.is-live .hero__still{visibility:hidden;animation:none}
@keyframes respira{from{transform:scale(1.03)}to{transform:scale(1.09)}}

/* ---------- barra superior ---------- */
.hero__bar{position:absolute;inset:0 0 auto 0;z-index:3;display:flex;align-items:center;gap:clamp(14px,2vw,28px);
  padding:calc(var(--pad) + env(safe-area-inset-top)) var(--pad) 0;
  font-size:13px;font-weight:500;font-stretch:108%;letter-spacing:.01em}
.lugar{display:inline-flex;align-items:center;gap:11px;margin-right:auto;padding:5px 19px 5px 5px;border-radius:999px;
  border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);
  box-shadow:0 1px 0 rgba(255,255,255,.75) inset,0 14px 34px -16px rgba(43,63,166,.5)}
.lugar:focus-visible{border-radius:999px}
.lugar__pin{position:relative;display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;
  background:var(--blanco);color:var(--cobalto);transition:background .35s ease,color .35s ease}
.lugar__pin svg{width:15px;height:15px;fill:currentColor;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.lugar__pin::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--cobalto);opacity:0;animation:onda 3.2s ease-out infinite}
.lugar:hover .lugar__pin{background:var(--cobalto);color:var(--blanco)}
.lugar:hover .lugar__pin svg{transform:translateY(-2px)}
.lugar__txt{display:grid;line-height:1.2}
.lugar__txt b{font-weight:600}
.lugar__txt i{font-style:normal;font-size:11px;opacity:.62}
@keyframes onda{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.8);opacity:0}}
.menu{position:relative;display:flex;gap:2px;list-style:none;margin:0;padding:5px;border-radius:999px;
  border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);
  box-shadow:0 1px 0 rgba(255,255,255,.75) inset,0 14px 34px -16px rgba(43,63,166,.5)}
.menu a{position:relative;z-index:1;display:block;padding:9px 17px;border-radius:999px}
.menu a:focus-visible{outline-offset:1px;border-radius:999px}
/* la pastilla que se desliza bajo el enlace señalado */
.menu__ind{position:absolute;z-index:0;top:5px;bottom:5px;left:0;width:0;border-radius:999px;pointer-events:none;
  background:rgba(255,255,255,.82);box-shadow:0 6px 16px -8px rgba(43,63,166,.6);opacity:0;
  transition:opacity .25s ease}
.menu__ind.is-on{opacity:1;transition:transform .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1),opacity .25s ease}
.link{position:relative;padding:6px 0}
.link::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.link:hover::after,.link:focus-visible::after{transform:scaleX(1);transform-origin:left}
.cita{display:inline-flex;align-items:center;gap:9px;padding:12px 19px 12px 15px;border-radius:999px;
  background:var(--tinta);color:var(--blanco);box-shadow:0 14px 30px -14px rgba(20,26,58,.7);
  transition:background .35s ease,box-shadow .35s ease}
.cita svg{width:12px;height:12px;fill:currentColor;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.cita:hover{background:var(--cobalto);box-shadow:0 14px 34px -12px rgba(43,63,166,.85)}
.cita:hover svg{transform:rotate(180deg) scale(1.3)}
.cita:focus-visible{border-radius:999px}
.menu-btn{display:none;font:inherit;color:inherit;background:none;border:0;padding:10px 0;cursor:pointer;align-items:center;gap:9px}
.menu-btn i{display:block;width:18px;height:7px;border-top:1.5px solid currentColor;border-bottom:1.5px solid currentColor}

/* ---------- marca + apellido, a los lados del retrato como en el tríptico original ---------- */
.hero__brand,.hero__kind{position:absolute;z-index:2;margin:0;color:var(--blanco);top:50%;
  filter:drop-shadow(0 0 26px rgba(43,63,166,.55)) drop-shadow(0 1px 5px rgba(20,26,58,.22))}
.hero__brand{left:clamp(24px,7.5vw,150px);width:clamp(210px,21vw,400px);
  transform:translate(calc(var(--mx)*-7px),calc(-50% + var(--my)*-5px))}
.hero__brand svg{display:block;width:100%;height:auto;fill:currentColor;overflow:visible}
.hero__kind{right:clamp(24px,7.5vw,150px);display:flex;align-items:baseline;white-space:nowrap;line-height:1;
  font-size:clamp(13px,1.42vw,27px);
  transform:translate(calc(var(--mx)*-7px),calc(-50% + var(--my)*-5px))}
.hero__kind .serif{font-family:"Bodoni Moda",Didot,"Bodoni 72",serif;font-variation-settings:"opsz" 96;
  font-weight:500;font-size:2.05em;letter-spacing:-.07em;display:inline-block;transform:scaleY(1.7);transform-origin:50% 76%}
.hero__kind .wide{font-weight:900;font-stretch:125%;font-size:1em;letter-spacing:-.01em;text-transform:uppercase;margin-left:-.42em}

/* ---------- pie: la página sigue ---------- */
.hero__foot{position:absolute;inset:auto 0 0 0;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:20px;
  padding:0 var(--pad) calc(26px + env(safe-area-inset-bottom));
  font-size:13px;font-weight:500;font-stretch:108%;letter-spacing:.01em}
.sigue{grid-column:2;display:inline-flex;align-items:center;gap:12px;padding:5px 21px 5px 5px;border-radius:999px;
  border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);
  box-shadow:0 1px 0 rgba(255,255,255,.75) inset,0 14px 34px -16px rgba(43,63,166,.5)}
.sigue:focus-visible{border-radius:999px}
.sigue__btn{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;overflow:hidden;
  background:var(--blanco);color:var(--cobalto);transition:background .35s ease,color .35s ease}
.sigue__btn svg{width:15px;height:15px;animation:baja 1.9s cubic-bezier(.5,0,.3,1) infinite}
.sigue:hover .sigue__btn{background:var(--cobalto);color:var(--blanco)}
@keyframes baja{0%{transform:translateY(-9px);opacity:0}35%{opacity:1}70%{transform:translateY(3px);opacity:1}100%{transform:translateY(10px);opacity:0}}
.insta{grid-column:3;justify-self:end;display:inline-flex;align-items:center;gap:8px;padding:10px 17px 10px 13px;border-radius:999px;
  border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);
  box-shadow:0 1px 0 rgba(255,255,255,.75) inset,0 14px 34px -16px rgba(43,63,166,.5);transition:background .3s ease,color .3s ease}
.insta svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.4}
.insta:hover{background:var(--blanco)}
.insta:focus-visible{border-radius:999px}

/* ---------- cursor propio: una maquinita de tatuar ---------- */
.cursor{position:absolute;left:0;top:0;z-index:9;pointer-events:none;opacity:0;transition:opacity .3s ease}
.hero.has-cur.cur-on .cursor{opacity:1}
/* la maquinita: la punta de la aguja es el punto exacto del clic */
.cursor__maq{position:absolute;left:-14.5px;top:-48.2px;width:40px;height:auto;overflow:visible;transform-origin:36.36% 98.15%;
  fill:var(--tinta);stroke:rgba(255,255,255,.82);stroke-width:1.1;paint-order:stroke;stroke-linejoin:round;
  filter:drop-shadow(0 3px 5px rgba(20,26,58,.28))}
.cursor__maq .m-needle{fill:none;stroke:var(--tinta);stroke-width:1.1;stroke-linecap:round;paint-order:normal}
.cursor__maq .m-rib{fill:none;stroke:rgba(255,255,255,.75);stroke-width:.7;stroke-linecap:round;paint-order:normal}
.cursor__maq-in{transition:transform .12s ease}
.cursor.is-over .cursor__maq-in{animation:zumba .07s linear infinite}      /* sobre algo pulsable, la máquina arranca */
.cursor.is-down .cursor__maq-in{animation:none;transform:translateY(3px)}  /* al pulsar, la aguja baja */
@keyframes zumba{0%,100%{transform:translateY(-.5px)}50%{transform:translateY(1.1px)}}
.hero.has-cur,.hero.has-cur a,.hero.has-cur button{cursor:none}
@media (prefers-reduced-motion: reduce){ .cursor.is-over .cursor__maq-in{animation:none} }

/* ---------- menú a pantalla completa (móvil / vertical) ---------- */
.panel{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:space-between;gap:24px;
  padding:calc(var(--pad) + env(safe-area-inset-top)) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom));
  background:rgba(222,230,249,.62);-webkit-backdrop-filter:blur(26px) saturate(1.25);backdrop-filter:blur(26px) saturate(1.25);
  opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
.hero.is-open .panel{opacity:1;visibility:visible;transition:opacity .45s ease}
.panel__top,.panel__foot{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:13px;font-weight:500;font-stretch:108%}
.panel__top p{margin:0}
.panel__list{list-style:none;margin:0;padding:0;display:grid;gap:.06em;
  font-family:"Bodoni Moda",Didot,serif;font-variation-settings:"opsz" 96;font-weight:500;font-size:clamp(44px,13.5vw,88px);line-height:1.22}
.panel__list a{display:inline-block;letter-spacing:-.05em;transform:translateY(.4em) scaleY(1.32);transform-origin:50% 80%;opacity:0;
  transition:transform .75s cubic-bezier(.16,.7,.2,1),opacity .5s ease;transition-delay:0s}
.hero.is-open .panel__list a{transform:scaleY(1.32);opacity:1;transition-delay:calc(var(--i)*60ms + 80ms)}
.panel__list a:hover{color:var(--cobalto)}

/* ---------- entrada: una sola secuencia al cargar ---------- */
.hero__brand,.hero__kind{opacity:0;animation:aparece 2.2s cubic-bezier(.16,.7,.2,1) 1.1s forwards}
.hero__kind{animation-delay:1.45s}
.hero__bar,.hero__foot{opacity:0;animation:sube 1.4s ease 2.4s forwards}
.hero__foot{animation-delay:2.9s}
@keyframes aparece{from{opacity:0;filter:blur(18px) drop-shadow(0 0 26px rgba(43,63,166,0))}
  to{opacity:1;filter:blur(0) drop-shadow(0 0 26px rgba(43,63,166,.55)) drop-shadow(0 1px 5px rgba(20,26,58,.22))}}
@keyframes sube{to{opacity:1}}

/* ---------- menú compacto cuando no caben los enlaces ---------- */
@media (max-width: 900px), (max-aspect-ratio: 11/10){
  .menu{display:none}
  .menu-btn{display:inline-flex}
  .insta{display:none}
}
@media (max-width: 520px){
  .hero__bar{gap:12px}
  .lugar{gap:8px;padding:4px 13px 4px 4px}
  .lugar__pin{width:30px;height:30px}
  .lugar__txt i,.lugar__rua,.menu-btn__t{display:none}
  .cita{padding:11px 15px 11px 12px;gap:7px}
}
/* ---------- vertical / móvil: el retrato manda, la marca baja ---------- */
@media (max-aspect-ratio: 11/10){
  .hero__brand,.hero__kind{left:50%;right:auto;top:auto}
  .hero__brand{bottom:calc(8svh + 126px);width:min(62vw,320px);transform:translate(calc(-50% + var(--mx)*-5px),0)}
  .hero__kind{bottom:calc(8svh + 80px);font-size:clamp(13px,3.7vw,19px);transform:translate(calc(-50% + var(--mx)*-5px),0)}
  .hero__foot{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .sigue{background:rgba(255,255,255,.34)}
  .hero:not(.is-live)::after{content:"";position:absolute;inset:auto 0 0 0;height:46%;z-index:1;pointer-events:none;
    background:linear-gradient(to top,rgba(52,74,170,.50),rgba(60,84,180,.22) 45%,rgba(60,84,180,0))}
}
@media (prefers-reduced-motion: reduce){
  .hero__still{animation:none;transform:scale(1.03)}
  .hero__brand,.hero__kind,.hero__bar,.hero__foot{animation-duration:.01s;animation-delay:0s}
  .sigue__btn svg,.lugar__pin::after{animation:none}
  .panel__list a{transition:none}
}
</style>
</head>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes, uImg, uMouse, uOff, uVis;
uniform float uT, uIntro, uMotion;

float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y); }
float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<4;i++){ s+=a*noise(p); p=p*2.03+vec2(17.1,9.2); a*=.5; } return s; }

/* destello en estrella, p en unidades de alto de imagen */
float star(vec2 p, float s){
  float r=length(p);
  float core=exp(-r*r/(s*s*.035));
  float h=exp(-abs(p.y)/(s*.020))*exp(-abs(p.x)/(s*.46));
  float v=exp(-abs(p.x)/(s*.020))*exp(-abs(p.y)/(s*.40));
  vec2 q=mat2(.7071,-.7071,.7071,.7071)*p;
  float d=exp(-abs(q.y)/(s*.026))*exp(-abs(q.x)/(s*.32))+exp(-abs(q.x)/(s*.026))*exp(-abs(q.y)/(s*.32));
  return core*.85+h*.75+v*.6+d*.25;
}
float glint(vec2 p, vec2 pos, float s, float sp, float ph){
  float tw=pow(.5+.5*sin(uT*sp+ph),5.);
  tw=mix(.35,tw,uMotion);
  return star(p-pos,s*(.75+.35*tw))*tw;
}
/* polvo de hielo en suspensión */
float dust(vec2 p, float scale, float size, float seed){
  p=p*scale+vec2(uT*.011*seed,uT*.022);
  vec2 i=floor(p), f=fract(p)-.5;
  float h=hash(i+seed*17.3);
  if(h<.62) return 0.;
  vec2 o=(vec2(hash(i+3.1),hash(i+7.7))-.5)*.55;
  o+=.07*vec2(sin(uT*.4+h*40.),cos(uT*.33+h*30.));
  float tw=.5+.5*sin(uT*(.5+h)+h*60.);
  return smoothstep(size,size*.2,length(f-o))*tw*(h-.62)/.38;
}

void main(){
  vec2 frag=gl_FragCoord.xy/uRes; frag.y=1.-frag.y;
  float asp=uImg.x/uImg.y;
  vec2 uv=uOff+frag*uVis;

  vec2 c=vec2(.53,.5);
  float ease=1.-pow(1.-uIntro,3.);
  float z=1.04+.014*sin(uT*.2)*uMotion+.075*(1.-ease);
  uv=(uv-c)/z+c;

  vec2 d=(uv-c)*vec2(asp,1.);
  float subj=1.-smoothstep(.16,.62,length(d*vec2(1.,.8)));
  float far=smoothstep(.2,.78,length(d));

  /* profundidad falsa: el retrato se desplaza algo más que el fondo */
  uv-=uMouse*(.003+.006*subj)*vec2(1./asp,1.)*asp*.6;

  /* el pelo y el hielo de los lados fluyen, la cara queda quieta */
  vec2 fp=uv*vec2(asp,1.);
  vec2 fl=vec2(fbm(fp*2.1+vec2(uT*.04,-uT*.022)),fbm(fp*2.1+vec2(5.2-uT*.032,1.3+uT*.027)))-.5;
  uv+=fl*.013*far*uMotion*vec2(1./asp,1.);

  /* deshielo de entrada: arranca escarchado y se aclara desde el retrato hacia fuera */
  float te=uIntro*uIntro*(3.-2.*uIntro);
  float front=te*2.5-.35;
  float fr=smoothstep(front-.24,front+.05,length(d)+(fbm(fp*5.)-.5)*.42);
  fr*=1.-smoothstep(.86,1.,uIntro);
  uv+=(vec2(noise(fp*38.),noise(fp*38.+11.3))-.5)*.02*fr*vec2(1./asp,1.);
  float bias=fr*5.;

  vec2 dir=uv-c; float ca=.006*min(dot(dir,dir),.3);
  vec3 col=vec3(texture2D(uTex,uv+dir*ca,bias).r,texture2D(uTex,uv,bias).g,texture2D(uTex,uv-dir*ca,bias).b);

  /* en vertical la foto no llena el alto: se funde hacia una bruma azul donde descansa la marca */
  if(uVis.y>1.001){
    float below=smoothstep(.70,1.0,uv.y);
    vec3 mist=mix(vec3(.86,.89,.975),vec3(.56,.64,.89),smoothstep(.95,uVis.y,uv.y));
    col=mix(col,mist,below);
  }

  /* luz que respira */
  col*=1.+.06*(fbm(fp*.7-vec2(uT*.03,0.))-.5)*uMotion*(.35+.65*far);

  /* cada tanto una luz fría barre el retrato y el cromo de la corona la recoge */
  float pos=fract(uT/11.+.3)*6.-1.6;
  float q=(uv.x-c.x)*asp*.9+(uv.y-.5)*.45;
  float band=exp(-pow((q-pos)/.09,2.));
  float lum=dot(col,vec3(.299,.587,.114));
  col+=vec3(.8,.88,1.)*col*(1.-col)*band*(.55+.9*smoothstep(.25,.7,lum))*(1.-.8*far)*uMotion;

  /* profundiza el azul de los laterales para que el blanco de la marca lea */
  col=mix(col,col*vec3(.71,.83,1.02),far*.42);

  /* bruma a la deriva */
  float fog=smoothstep(.34,.86,fbm(fp*1.35+vec2(uT*.02,uT*.007)+fl*.7));
  col=mix(col,vec3(.93,.955,1.),fog*(.015+.24*far));

  /* destellos sobre la corona y el pendiente */
  vec2 p=uv*vec2(asp,1.);
  float g=0.;
  g+=glint(p,vec2(.5623*asp,.2089),.115,.83,0.);
  g+=glint(p,vec2(.6011*asp,.3134),.112,.61,2.1);
  g+=glint(p,vec2(.4531*asp,.1838),.075,1.07,4.0);
  g+=glint(p,vec2(.4100*asp,.4944),.070,.94,1.2);
  g+=glint(p,vec2(.6492*asp,.3384),.060,1.31,5.3);
  g+=glint(p,vec2(.5845*asp,.3733),.065,.72,3.3);
  g+=glint(p,vec2(.7201*asp,.4206),.058,.55,0.7);
  g+=glint(p,vec2(.4464*asp,.1031),.060,1.19,2.7);
  col+=vec3(.86,.9,1.)*g*.85*(1.-fr);

  /* polvo */
  float ds=dust(p,24.,.06,1.)*.55+dust(p,11.,.09,-1.7)*.4+dust(p,4.5,.22,2.3)*.12;
  col=mix(col,vec3(1.),clamp(ds,0.,1.)*.8*uMotion*(.12+.88*far));

  /* escarcha y su frente brillante */
  col=mix(col,vec3(.93,.95,1.),fr*.55);
  col+=vec3(.8,.9,1.)*fr*(1.-fr)*.4;

  /* en horizontal el borde inferior se disuelve en el color de la página: lo que sigue está ahí */
  if(uVis.y<=1.001) col=mix(col,vec3(.914,.937,.98),smoothstep(.84,1.02,frag.y)*.8);

  /* grano y fundido inicial */
  col+=(hash(gl_FragCoord.xy+fract(uT)*91.7)-.5)*.028;
  col=mix(vec3(.95,.965,1.),col,smoothstep(0.,.1,uIntro));
  gl_FragColor=vec4(col,1.);
}
</script>

(function(){
  var hero=document.getElementById('hero'), panel=document.getElementById('panel'),

  function set(open){
    hero.classList.toggle('is-open',open); abrir.setAttribute('aria-expanded',open?'true':'false');
    if(open){ panel.removeAttribute('inert'); cerrar.focus(); } else { panel.setAttribute('inert',''); abrir.focus(); }
  }
  abrir.addEventListener('click',function(){ set(true); });
  cerrar.addEventListener('click',function(){ set(false); });
  panel.addEventListener('click',function(e){ if(e.target.closest('a')) set(false); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&hero.classList.contains('is-open')) set(false); });
})();

/* ---------- pastilla deslizante del menú ---------- */
(function(){
  var menu=document.getElementById('menu'), ind=menu.querySelector('.menu__ind');
  function to(a){
    if(!ind.classList.contains('is-on')){ ind.style.width=a.offsetWidth+'px'; ind.style.transform='translateX('+a.offsetLeft+'px)'; ind.offsetWidth; ind.classList.add('is-on'); }
    ind.style.width=a.offsetWidth+'px'; ind.style.transform='translateX('+a.offsetLeft+'px)';
  }
  function off(){ ind.classList.remove('is-on'); }
  Array.prototype.forEach.call(menu.querySelectorAll('a'),function(a){
    a.addEventListener('pointerenter',function(){ to(a); }); a.addEventListener('focus',function(){ to(a); }); });
  menu.addEventListener('pointerleave',off); menu.addEventListener('focusout',function(e){ if(!menu.contains(e.relatedTarget)) off(); });
})();

/* ---------- cursor propio ---------- */
(function(){
  var hero=document.getElementById('hero'), el=document.getElementById('cursor');
  var maq=el.querySelector('.cursor__maq');
  var fine=window.matchMedia('(hover:hover) and (pointer:fine)');
  var x=0,y=0,px=0,tilt=0,raf=0,inside=false;
  function sync(){ hero.classList.toggle('has-cur',fine.matches); if(!fine.matches) hero.classList.remove('cur-on'); }
  function tick(){
    /* se inclina un poco con el movimiento, como una mano; la punta de la aguja es el punto del clic */
    var want=Math.max(-14,Math.min(14,(x-px)*1.1)); px=x; tilt+=(want-tilt)*.14;
    maq.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) rotate('+(38+tilt).toFixed(2)+'deg)';
    raf=fine.matches&&(inside||Math.abs(tilt)>.05)?requestAnimationFrame(tick):0;
  }
  hero.addEventListener('pointermove',function(e){
    if(e.pointerType==='touch'||!fine.matches) return;
    var r=hero.getBoundingClientRect(); x=e.clientX-r.left; y=e.clientY-r.top;
    if(!inside){ inside=true; px=x; hero.classList.add('cur-on'); }
    el.classList.toggle('is-over',!!(e.target.closest&&e.target.closest('a,button')));
    if(!raf) raf=requestAnimationFrame(tick);
  });
  hero.addEventListener('pointerleave',function(){ inside=false; hero.classList.remove('cur-on'); });
  hero.addEventListener('pointerdown',function(){ el.classList.add('is-down'); });
  window.addEventListener('pointerup',function(){ el.classList.remove('is-down'); });
  if(fine.addEventListener) fine.addEventListener('change',sync);
  sync();
})();

/* ---------- fondo vivo ---------- */
(function(){
  var hero=document.getElementById('hero'), img=document.getElementById('foto'), cv=document.getElementById('gl');
  var calm=window.matchMedia('(prefers-reduced-motion: reduce)');
  var gl=null, isGL2=false;
  try{ gl=cv.getContext('webgl2',{antialias:false,alpha:false}); isGL2=!!gl;
       if(!gl) gl=cv.getContext('webgl',{antialias:false,alpha:false}); }catch(e){}
  if(!gl) return;                       /* sin WebGL queda la foto con un zoom lento en CSS */

  function sh(type,src){ var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s)); return null; } return s; }
  var vs=sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}');
  var fs=sh(gl.FRAGMENT_SHADER,document.getElementById('frag').textContent);
  if(!vs||!fs) return;
  var pr=gl.createProgram(); gl.attachShader(pr,vs); gl.attachShader(pr,fs); gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){ console.error(gl.getProgramInfoLog(pr)); return; }
  gl.useProgram(pr);
  var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var U={}; ['uTex','uRes','uImg','uMouse','uOff','uVis','uT','uIntro','uMotion'].forEach(function(n){U[n]=gl.getUniformLocation(pr,n);});

  var mouse={x:0,y:0,tx:0,ty:0}, t0=0, running=false, visible=true, raf=0, ready=false;

  function upload(){
    var src=img, max=gl.getParameter(gl.MAX_TEXTURE_SIZE);
    if(img.naturalWidth>max){ var k=max/img.naturalWidth, c2=document.createElement('canvas');
      c2.width=max; c2.height=Math.round(img.naturalHeight*k); c2.getContext('2d').drawImage(img,0,0,c2.width,c2.height); src=c2; }
    var tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    if(isGL2){ gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR); }
    else gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.uniform1i(U.uTex,0);
    gl.uniform2f(U.uImg,img.naturalWidth,img.naturalHeight);
    ready=true; resize(); start();
    requestAnimationFrame(function(){ hero.classList.add('is-live'); });
  }
  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,1.75), w=hero.clientWidth, h=hero.clientHeight;
    cv.width=Math.max(2,Math.round(w*dpr)); cv.height=Math.max(2,Math.round(h*dpr));
    gl.viewport(0,0,cv.width,cv.height);
    gl.uniform2f(U.uRes,cv.width,cv.height);
    /* encuadre: cubre en horizontal; en vertical se aleja para que quepa el perfil entero */
    if(img.naturalWidth){
      var iw=img.naturalWidth, ih=img.naturalHeight;
      var cover=Math.max(cv.width/iw,cv.height/ih), vx=cv.width/cover/iw;
      if(cv.width/cv.height<1.1) vx=Math.max(.36,1.6*(cv.width/cv.height)*(ih/iw));   /* mismo corte que el CSS */
      var s=cv.width/(vx*iw), vy=cv.height/s/ih;
      var cx=.56-.055*Math.min(1,Math.max(0,(vx-.45)/.25));
      var ox=Math.min(Math.max(cx-vx/2,0),1-vx), oy=vy>1?0:(1-vy)*.5;
      gl.uniform2f(U.uVis,vx,vy); gl.uniform2f(U.uOff,ox,oy);
    }
    if(ready && !running) draw(performance.now());
  }
  function draw(now){
    if(!t0) t0=now;
    var t=(now-t0)/1000, still=calm.matches;
    mouse.x+=(mouse.tx-mouse.x)*.045; mouse.y+=(mouse.ty-mouse.y)*.045;
    var mx=mouse.x+(still?0:.32*Math.sin(t*.19)), my=mouse.y+(still?0:.26*Math.cos(t*.14));
    hero.style.setProperty('--mx',mx.toFixed(3)); hero.style.setProperty('--my',my.toFixed(3));
    gl.uniform1f(U.uT,still?12.5:t);
    gl.uniform1f(U.uIntro,still?1:Math.min(1,t/3.6));
    gl.uniform1f(U.uMotion,still?0:1);
    gl.uniform2f(U.uMouse,mx,my);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  function loop(now){ draw(now); raf=requestAnimationFrame(loop); }
  function start(){ if(running||!ready) return; if(calm.matches||!visible||document.hidden){ draw(performance.now()); return; }
    running=true; raf=requestAnimationFrame(loop); }
  function stop(){ running=false; cancelAnimationFrame(raf); }

  hero.addEventListener('pointermove',function(e){
    if(e.pointerType==='touch') return;
    var r=hero.getBoundingClientRect();
    mouse.tx=((e.clientX-r.left)/r.width-.5)*2; mouse.ty=((e.clientY-r.top)/r.height-.5)*2; });
  hero.addEventListener('pointerleave',function(){ mouse.tx=0; mouse.ty=0; });
  window.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  if('IntersectionObserver' in window) new IntersectionObserver(function(en){ visible=en[0].isIntersecting; visible?start():stop(); }).observe(hero);
  if(calm.addEventListener) calm.addEventListener('change',function(){ stop(); start(); });
  cv.addEventListener('webglcontextlost',function(e){ e.preventDefault(); stop(); hero.classList.remove('is-live'); });

  if(img.complete&&img.naturalWidth) upload(); else img.addEventListener('load',upload);
})();
</script>
</body>
</html>
